name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    name: Evaluate and format
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: DeterminateSystems/flake-checker-action@v14

      - name: Check nix formatting
        run: nix fmt -- --check .

      # Instantiates every host (plus the dev shell and formatter) without
      # building them; the build job below does the slow builds. Not
      # `nix flake check --no-build`: that evaluates with a read-only store,
      # so flake inputs that read their own source (e.g. hyprland) fail on a
      # fresh runner. IFD is disallowed so an eval-time read of a package
      # fails here every time, not only when the cache is cold. Same as
      # `just check-eval`.
      - name: Evaluate hosts
        run: |
          nix eval --json --option allow-import-from-derivation false .#checks.x86_64-linux --apply 'builtins.mapAttrs (_: c: c.drvPath)'
          nix eval --raw --option allow-import-from-derivation false .#devShells.x86_64-linux.default.drvPath
          nix eval --raw --option allow-import-from-derivation false .#formatter.x86_64-linux.drvPath

      - name: List hosts
        id: hosts
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  # Full system builds are slow, so they run on main and on demand only;
  # pull requests get the evaluation above.
  build:
    name: Build ${{ matrix.host }}
    needs: eval
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.eval.outputs.hosts) }}
    steps:
      # A desktop closure does not fit in the runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Same caches the hosts use (modules/nix/module.nix).
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://hyprland.cachix.org https://nixpkgs-unfree.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nixpkgs-unfree.cachix.org-1:hqvoInulhbV4nJ9yJOEr+4wxhDV4xq2d1DK7S6Nj6rs=

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs ".#checks.x86_64-linux.${{ matrix.host }}"
